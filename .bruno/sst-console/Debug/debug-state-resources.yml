info:
  name: debug SST state resources
  type: http
  seq: 2

http:
  method: GET
  url: "{{ApiBase}}/debug/accounts/:accountId/state/:appName/:stageName/resources"
  params:
    - name: accountId
      value: "{{AwsAccountId}}"
      type: path
    - name: appName
      value: mafia
      type: path
    - name: stageName
      value: jackson
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
