info:
    name: Update account sync policy
    type: http
    seq: 8

http:
    method: PUT
    url: "{{ApiBase}}/accounts/:accountId/sync-policy"
    params:
        - name: accountId
          value: "{{AwsAccountId}}"
          type: path
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "policy": {
                "allowList": [],
                "ignoreList": []
              }
            }
    auth: inherit

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
    forwardAuthorizationHeader: true
