info:
    name: Get stage status
    type: http
    seq: 1

http:
    method: GET
    url: "{{ApiBase}}/issues/:appName/:stageName"
    params:
        - name: appName
          value: "{{SSTApp}}"
          type: path
        - name: stageName
          value: "{{SSTAppStage}}"
          type: path
    auth: inherit

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
