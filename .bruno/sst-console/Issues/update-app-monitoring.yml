info:
    name: Update app monitoring
    type: http
    seq: 6

http:
    method: POST
    url: "{{ApiBase}}/issues/apps/:appName/monitoring"
    params:
        - name: appName
          value: "{{SSTApp}}"
          type: path
    headers:
        - name: Content-Type
          value: application/json
    body:
        type: json
        data: |-
            {
              "enabled": true
            }
    auth: inherit

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
