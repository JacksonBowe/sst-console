info:
  name: AuthRecover
  type: http
  seq: 4

http:
  method: POST
  url: "{{ApiBase}}/noauth/recover"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "{{AuthEmail}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
