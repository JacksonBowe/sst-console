info:
    name: Delete user
    type: http
    seq: 4

http:
    method: DELETE
    url: "{{ApiBase}}/users/:id"
    params:
        - name: id
          value: "{{UserId}}"
          type: path
    auth: inherit

settings:
    encodeUrl: true
    timeout: 0
    followRedirects: true
    maxRedirects: 5
    forwardAuthorizationHeader: true
