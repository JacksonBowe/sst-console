name: Release

on:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    publish:
        name: Verify and publish release
        runs-on: ubuntu-latest
        steps:
            - name: Check out release tag
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  ref: ${{ github.ref }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Verify release tag
              shell: bash
              run: |
                  tag="${GITHUB_REF_NAME}"

                  if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
                      echo "Release tag must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.NUMBER."
                      exit 1
                  fi

                  if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
                      echo "Release tag must be annotated."
                      exit 1
                  fi

                  git fetch origin main
                  tag_commit="$(git rev-list -n 1 "$tag")"

                  if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
                      echo "Release tag must point to a commit reachable from main."
                      exit 1
                  fi

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check formatting, linting, and types
              run: bun run check

            - name: Run tests
              run: bun run test

            - name: Publish GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              shell: bash
              run: |
                  tag="${GITHUB_REF_NAME}"

                  if gh release view "$tag" >/dev/null 2>&1; then
                      echo "GitHub Release for $tag already exists."
                      exit 0
                  fi

                  if [[ "$tag" == *-* ]]; then
                      gh release create "$tag" --generate-notes --prerelease
                  else
                      gh release create "$tag" --generate-notes
                  fi
